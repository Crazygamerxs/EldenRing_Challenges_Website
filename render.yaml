services:
  - type: web
    name: eldenring-challenges
    env: python
    buildCommand: "./build.sh"
    startCommand: "cd mybackend && gunicorn mybackend.wsgi:application"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: mybackend.settings_render
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: eldenring-db
          property: connectionString
    healthCheckPath: /api/

databases:
  - name: eldenring-db
    databaseName: eldenring_prod
    user: eldenring_user
